<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- calculator-->
<div class="calculator">
     <input type="text" id="display" readonly>
     <dic class="power-button">
        <button class="on-btn" onclick="turnOn()">ON</button>
        <button class="off-btn" onclick="turnOff()">OFF</button>
     </dic>
    <!-- Number Pad -->
    <div class="keys">
 <!--operators -->
        <button onclick="cleardisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="press('√')">√</button>
        <button onclick="press('+')">+</button>

                </div>
                <div>
                    <input type="button" value="1" onclick="display.value += '1'">
                    <input type="button" value="4" onclick="display.value += '4'">
                    <input type="button" value="7" onclick="display.value += '7'">
                </div>
                <div>
                    <input type="button" value="2" onclick="display.value += '2'">
                    <input type="button" value="5" onclick="display.value += '5'">
                    <input type="button" value="8" onclick="display.value += '8'">
                  
                    <input type="button" value="=" onclick="calculate()" 
                     class="equal">
                  
                </div>
                <!-- Display -->
                <div class="display">
                    <input type="text" id="display" name="display">
                </div>
                <!-- Operation Buttons -->
                <div>
                    
                    <input type="button" value="+" onclick="display.value +='+'">
                    <input type="button" value="-" onclick="display.value += '-'">
                    <input type="button" value="/" onclick="display.value += '/'">
                    <input type="button" value="*" onclick="display.value += '*'">
                </div>
                <div>
                    <input type="button" value="AC" onclick="clearDisplay()" class="del">
                    <input type="button" value="DEL" onclick="deleteLast()" class="del">
                    
                </div>
                <!--modulo and exponent function-->
                <div>
                    <input type="button" value="%" onclick="press('%')">
                    <input type="button" value="^" onclick="press('^')">
                </div>
            </form>
        </div>
    </div>
    <div class="my-class">My Class</div>

    <!--External JavaScript-->
    <script src="index.js"></script>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('4')">4</button>

        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('1')">1</button>

        <button class="equal" onclick="calculate()">=</button>

        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="press('0')">0</button>
    </div>
    <!--operators -->
    <div class="operators">
        <button onclick="press('*')">x</button>
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>
        <button onclick="press('-')">-</button>
        <button onclick="press('÷')">÷</button>
    </div>
    </div>

</div>
<script src="index.js"></script>
</body>
</html>
